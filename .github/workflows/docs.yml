name: Docs

on:
    push:
        branches: [main]
        paths:
            - "apps/docs/**"
            - ".github/workflows/docs.yml"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        name: Build & deploy docs
        runs-on: ubuntu-latest
        # NOTE: requires repo secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
        # to be configured in GitHub before this job will succeed. The workflow file
        # ships intentionally — secrets will be wired up by the maintainer.
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build docs
              run: bun run --cwd apps/docs build:docs

            - name: Deploy to Vercel
              uses: amondnet/vercel-action@v25
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
                  working-directory: apps/docs
                  vercel-args: "--prod"
